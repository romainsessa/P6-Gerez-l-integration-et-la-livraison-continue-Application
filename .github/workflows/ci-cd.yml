name: CI CD 

on:
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ]
  workflow_dispatch: 

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: G-rez-l-int-gration-et-la-livraison-continue-Application-Java
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle
      - name: Run tests
        run: |
          chmod +x ../run-test.sh
          ../run-test.sh
      - name: Upload backend test reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: G-rez-l-int-gration-et-la-livraison-continue-Application-Java/test-results

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: G-rez-l-int-gration-et-la-livraison-continue-Application-Angular
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4 
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: G-rez-l-int-gration-et-la-livraison-continue-Application-Angular/package-lock.json
      - name: Run tests
        run: |
          chmod +x ../run-test.sh
          ../run-test.sh
      - name: Upload frontend test reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: G-rez-l-int-gration-et-la-livraison-continue-Application-Angular/test-results
  
  build-backend:
    name: Build and Push Docker Image Backend
    needs: test-backend 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with: 
          context:  G-rez-l-int-gration-et-la-livraison-continue-Application-Java
          file: G-rez-l-int-gration-et-la-livraison-continue-Application-Java/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/workshop-organizer-api:latest
            ghcr.io/${{ github.repository_owner }}/workshop-organizer-api:${{ github.sha }}
  build-frontend:
    name: Build and Push Docker Image Frontend
    needs: test-frontend 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with: 
          context:  G-rez-l-int-gration-et-la-livraison-continue-Application-Angular
          file: G-rez-l-int-gration-et-la-livraison-continue-Application-Angular/Dockerfile
          push: true
          tags: |
           ghcr.io/${{ github.repository_owner }}/workshop-organizer-api:latest
           ghcr.io/${{ github.repository_owner }}/workshop-organizer-api:${{ github.sha }}
